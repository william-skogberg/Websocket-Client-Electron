appId: com.yourname.ws-pastebin
productName: WS Pastebin
files:
  - dist/**/*
  - main.js
  - preload.js
  - package.json
directories:
  buildResources: assets
extraResources:
  - from: assets
    to: assets
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Utility
